<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DhewaMart — Aplikasi Kasir</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%230F766E%27/%3E%3Cg fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 transform=%27translate(4 4) scale(.67)%27%3E%3Ccircle cx=%278%27 cy=%2721%27 r=%271%27/%3E%3Ccircle cx=%2719%27 cy=%2721%27 r=%271%27/%3E%3Cpath d=%27M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--pri:#0F766E;--pri-d:#0B5A54;--pri-soft:#E3F4F1;--acc:#F59E0B;--acc-soft:#FEF3DC;--bg:#F3F6F5;--card:#fff;--ink:#0E1E1B;--ink2:#334542;--mut:#71817E;--line:#E2E9E7;--red:#DC3D43;--red-soft:#FDECEC;--blue:#2563EB;--r:16px;--sh:0 1px 2px rgba(14,40,35,.05),0 6px 18px rgba(14,40,35,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#D9E3E0;color:var(--ink);font-size:14px;line-height:1.4}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mut{color:var(--mut)}.b{font-weight:700}.sm{font-size:12px}.xs{font-size:11px}.r{text-align:right}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.f1{flex:1;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;font-weight:700;transition:.15s;white-space:nowrap}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.acc{background:var(--acc);color:#3B2A05}
.btn.ghost{background:#EEF2F1;color:var(--ink2)}.btn.ghost:hover{background:#E4EAE8}
.btn.out{border:1.5px solid var(--line);background:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.block{width:100%}.btn.lg{height:54px;font-size:16px;border-radius:14px}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.ibtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#EEF2F1;color:var(--ink2)}
.ibtn:hover{background:#E2E9E7}
.inp{width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:80px;font-size:12px;font-family:ui-monospace,monospace}
.inp.big{height:58px;font-size:24px;font-weight:800;text-align:right}
label.lb{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .full{grid-column:1/-1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#EEF2F1;color:var(--ink2)}
.badge.g{background:var(--pri-soft);color:var(--pri)}.badge.y{background:var(--acc-soft);color:#92600A}.badge.rd{background:var(--red-soft);color:var(--red)}.badge.bl{background:#E5EDFF;color:var(--blue)}
.sec-t{font-size:13px;font-weight:800;color:var(--ink2);margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.empty .e{font-size:40px;margin-bottom:8px}

/* ---------- MOBILE SHELL ---------- */
.phone{height:100vh;height:100dvh;max-width:440px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){body.mobile{padding:14px 0}.phone{height:calc(100vh - 28px);border-radius:32px;box-shadow:0 30px 80px rgba(10,40,35,.25),0 0 0 10px #10201D}}
.mh{background:linear-gradient(135deg,#0F766E,#115E59);color:#fff;padding:16px 16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mlogo{width:44px;height:44px;border-radius:14px;background:#fff;color:var(--pri);display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.mh .store{font-size:17px;font-weight:800;letter-spacing:-.2px}
.kchip{margin-top:4px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:99px;color:#fff}
.mh .ibtn{background:rgba(255,255,255,.16);color:#fff}
#main.scroll{flex:1;overflow:auto;padding:14px 14px 100px}
.bnav{height:66px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mut);position:relative}
.bnav button.on{color:var(--pri)}
.bnav button.on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--pri)}
.cartbar{position:absolute;left:12px;right:12px;bottom:78px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s ease;z-index:5}
.cartbar .cnt{width:36px;height:36px;border-radius:10px;background:var(--acc);color:#3B2A05;display:grid;place-items:center;font-weight:800}
.cartbar .go{background:var(--pri);padding:9px 14px;border-radius:11px;font-weight:700;font-size:13px}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* ---------- DESKTOP SHELL ---------- */
.desk{display:flex;height:100vh;background:var(--bg)}
.side{width:248px;background:#0E2B27;color:#CFE3DF;display:flex;flex-direction:column;padding:18px 14px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#14B8A6,#0F766E);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.brand b{display:block;color:#fff;font-size:16px}.brand small{font-size:11.5px;color:#8FB2AC}
.snav button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;color:#B8D2CD;margin-bottom:2px;text-align:left}
.snav button:hover{background:rgba(255,255,255,.06)}
.snav button.on{background:#14B8A6;color:#062A26}
.snav .lk{margin-left:auto;opacity:.6}
.side-foot{margin-top:auto;font-size:11px;color:#7FA19B}
.modesw{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.07);border-radius:12px;padding:4px;margin-bottom:12px}
.modesw button{padding:8px;border-radius:9px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center;color:#B8D2CD}
.modesw button.on{background:#fff;color:var(--ink)}
.dmain{flex:1;display:flex;flex-direction:column;min-width:0}
.dh{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.dh h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.dh .kchip{background:var(--pri-soft);color:var(--pri);margin:0}
#main.dscroll{flex:1;overflow:auto;padding:22px 24px 30px}
#main.dscroll.fix{overflow:hidden;padding:18px 24px}

/* ---------- KASIR ---------- */
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 12px;height:46px;box-shadow:var(--sh);color:var(--mut)}
.searchbar input{border:0;outline:none;flex:1;height:100%;background:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 13px;border-radius:99px;background:#fff;font-weight:600;font-size:12.5px;color:var(--ink2);border:1.5px solid var(--line);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.desktop .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pcard{background:#fff;border-radius:16px;padding:8px;text-align:left;box-shadow:var(--sh);transition:.12s;display:flex;flex-direction:column;border:2px solid transparent}
.pcard:active{transform:scale(.97)}
.pcard.inc{border-color:var(--pri)}
.pcard.out{opacity:.5}
.pimg{aspect-ratio:1.35;border-radius:11px;display:grid;place-items:center;font-size:38px;position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.qbadge{position:absolute;top:6px;right:6px;background:var(--pri);color:#fff;min-width:24px;height:24px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px;z-index:2}
.outtag{position:absolute;inset:auto 0 0 0;background:rgba(220,61,67,.92);color:#fff;font-size:10px;font-weight:800;text-align:center;padding:3px;z-index:2}
.pname{font-weight:700;font-size:13px;margin:8px 2px 2px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 2px}
.price{font-weight:800;color:var(--pri);font-size:13.5px}
.stk{font-size:10.5px;font-weight:700;color:var(--mut);background:#F1F4F3;padding:2px 6px;border-radius:6px}
.stk.low{background:var(--red-soft);color:var(--red)}
.kasir-wrap{display:grid;grid-template-columns:1fr 390px;gap:20px;height:100%}
.kprod{min-height:0}
.desktop .kprod{overflow:auto;padding-right:4px;padding-bottom:20px}
.cartpanel{background:#fff;border-radius:20px;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cart{display:flex;flex-direction:column;min-height:0;height:100%}
.cart-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
.cart-h h3{font-size:16px;font-weight:800}
.citems{flex:1;overflow:auto;padding:0 18px;min-height:60px}
.ci{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ci .em{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;flex-shrink:0;overflow:hidden}
.ci .em img{width:100%;height:100%;object-fit:cover}
.qty{display:flex;align-items:center;gap:2px;background:#F1F4F3;border-radius:10px;padding:2px}
.qty button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.qty button svg{width:15px;height:15px}
.qty span{min-width:26px;text-align:center;font-weight:800;font-size:13px}
.cfoot{padding:12px 18px 18px;border-top:1px solid var(--line);background:#FAFCFB}
.mbr{display:flex;align-items:center;gap:10px;background:var(--pri-soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.mbr.add{background:#fff;border:1.5px dashed #BFD3CE;color:var(--pri);font-weight:700;justify-content:center;width:100%}
.av{width:36px;height:36px;border-radius:99px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.tog{position:relative;width:42px;height:24px;border-radius:99px;background:#CBD6D3;transition:.2s;flex-shrink:0}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:99px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--pri)}.tog.on::after{left:21px}
.sumr{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:var(--ink2)}
.sumr.tot{font-size:19px;font-weight:800;color:var(--ink);padding:8px 0 4px}
.paybtns{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:10px}

/* ---------- MODAL ---------- */
.ov{position:fixed;inset:0;background:rgba(8,24,21,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.mbox{background:#fff;width:100%;max-width:440px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 22px;animation:up .25s ease}
.mbox.cartsheet{padding:0;display:flex;flex-direction:column;height:86vh}
.mbox.cartsheet .cart{height:100%}
.desktop .ov{align-items:center}
.desktop .mbox{border-radius:22px;max-width:480px}
.desktop .mbox.wide{max-width:620px}
.grab{width:40px;height:5px;border-radius:9px;background:#D5DEDB;margin:0 auto 12px}
.desktop .grab{display:none}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mhead h3{font-size:17px;font-weight:800}

/* QRIS */
.qris{border:1.5px solid var(--line);border-radius:18px;overflow:hidden;margin:12px 0}
.qris-h{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.qlogo{font-weight:900;letter-spacing:1px;font-size:18px}
.qlogo i{font-style:normal;color:var(--red)}
.qris-b{padding:16px;text-align:center}
#qrbox{display:inline-block;padding:10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
#qrbox img,#qrbox canvas{display:block;width:220px!important;height:220px!important}
.qamt{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.5px}
.ewal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.demo-w{background:var(--acc-soft);color:#7A5208;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:10px;display:flex;gap:8px;text-align:left}
.waiting{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--mut);margin-top:8px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--acc);animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.25}}

/* receipt */
.ok-ic{width:64px;height:64px;border-radius:99px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;margin:4px auto 8px}
.ok-ic svg{width:34px;height:34px;stroke-width:3}
.rcpt{background:#FBFBF8;border:1px solid #ECECE4;border-radius:12px;padding:16px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#222;margin:12px 0}
.rcpt .c{text-align:center}
.rcpt hr{border:0;border-top:1px dashed #BBB;margin:8px 0}
.rcpt .l{display:flex;justify-content:space-between;gap:8px}
.rcpt .t{font-weight:800;font-size:14px}

/* lists */
.li{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh);margin-bottom:8px;width:100%;text-align:left}
.li .em{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex-shrink:0;overflow:hidden;position:relative}
.li .em img{width:100%;height:100%;object-fit:cover}
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tbar .searchbar{flex:1;min-width:180px}
.tabs{display:flex;background:#E7EDEB;border-radius:12px;padding:4px;gap:2px}
.tabs button{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.mini small{font-size:11.5px;color:var(--mut);font-weight:600}
.mini b{display:block;font-size:18px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.mini.hl{background:linear-gradient(135deg,#0F766E,#115E59);color:#fff}.mini.hl small{color:#BDE6DF}

/* settings */
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center;background:#fff;transition:.15s}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt .oi{width:46px;height:46px;border-radius:12px;background:#EEF2F1;display:grid;place-items:center;margin:0 auto 8px;color:var(--ink2)}
.opt.on .oi{background:var(--pri);color:#fff}
.opt b{display:block;font-size:13.5px}.opt small{font-size:11px;color:var(--mut)}
.setcard{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.setcard h4{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.setcard h4 .hi{width:30px;height:30px;border-radius:9px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}
.setcard h4 .hi svg{width:17px;height:17px}
.kslist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ks{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:99px;background:#EEF2F1;font-weight:600;font-size:13px}
.ks.on{background:var(--pri);color:#fff}
.ks button{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;background:rgba(0,0,0,.08)}
.ks button svg{width:12px;height:12px}
.login{max-width:380px;margin:20px auto;text-align:center}
.login .lic{width:64px;height:64px;border-radius:18px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;margin:0 auto 12px}
.login .lic svg{width:30px;height:30px}
.credit{text-align:center;font-size:11px;color:var(--mut);padding:18px 0 6px}
.credit b{color:var(--pri)}
.desk-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .ki{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.kpi .ki svg{width:19px;height:19px}
.kpi small{font-size:12px;color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi.hero{background:linear-gradient(135deg,#0F766E 0%,#0E4F4A 100%);color:#fff}
.kpi.hero small{color:#B5E2DA}.kpi.hero .ki{background:rgba(255,255,255,.15);color:#fff}
.dgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.dgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:1200px){.dgrid3{grid-template-columns:1fr 1fr}}
.mobile .dgrid,.mobile .dgrid3,.mobile .desk-cols{grid-template-columns:1fr}
.mobile .kpis{grid-template-columns:1fr 1fr;gap:10px}
.mobile .kpi b{font-size:17px}
.panel{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--sh)}
.panel h4{font-size:14.5px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:200px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid #F0F3F2}
.tbl tr:last-child td{border-bottom:0}
.rank{width:22px;height:22px;border-radius:7px;background:#EEF2F1;display:inline-grid;place-items:center;font-size:11px;font-weight:800}
.bar{height:7px;border-radius:9px;background:#EEF2F1;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.desktop #toast{bottom:30px}

const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24" ${s?`style="width:${s}px;height:${s}px"`:''}>${IC[n]||''}</svg>`;

/* ================== DATA ================== */
const KEY='kasirku_v1';
function seed(){
  const cats=[
    {id:'rokok',name:'Rokok',ico:'🚬'},{id:'sembako',name:'Sembako',ico:'🌾'},{id:'makanan',name:'Makanan & Snack',ico:'🍪'},
    {id:'minuman',name:'Minuman',ico:'🥤'},{id:'rt',name:'Rumah Tangga',ico:'🧹'},{id:'pribadi',name:'Perawatan Diri',ico:'🧴'},
    {id:'obat',name:'Obat & P3K',ico:'💊'},{id:'gas',name:'Gas & Galon',ico:'🔥'},{id:'lain',name:'Lain-lain',ico:'📦'}];
  const P=(name,cat,price,cost,stock,ico)=>({id:uid(),name,cat,price,cost,stock,min:5,sku:'',ico,img:''});
  const products=[
    P('3UO Series','rokok',20000,17500,40,'🚬'),P('Sampoerna A Mild 16','rokok',33500,31000,30,'🚬'),P('Gudang Garam Surya 12','rokok',28000,26000,25,'🚬'),
    P('Djarum Super 12','rokok',25500,23500,24,'🚬'),P('Diplomat Mild 16','rokok',27000,25000,3,'🚬'),
    P('Beras Premium 5kg','sembako',78000,72000,15,'🍚'),P('Minyak Goreng 1L','sembako',19000,17000,30,'🫗'),P('Gula Pasir 1kg','sembako',18000,16500,20,'🧂'),
    P('Telur Ayam 1kg','sembako',30000,27500,12,'🥚'),P('Indomie Goreng','sembako',3500,3000,120,'🍜'),P('Tepung Terigu 1kg','sembako',13000,11500,4,'🌾'),
    P('Chitato 68g','makanan',11500,10000,18,'🥔'),P('Oreo 119g','makanan',9500,8200,20,'🍪'),P('Roti Tawar','makanan',16000,14000,8,'🍞'),P('Kacang Garuda','makanan',9000,7800,15,'🥜'),
    P('Aqua 600ml','minuman',4000,3000,60,'💧'),P('Teh Pucuk 350ml','minuman',4000,3200,48,'🍵'),P('Kopi Sachet (renceng)','minuman',15000,13000,20,'☕'),
    P('Susu UHT 200ml','minuman',6000,5000,36,'🥛'),P('Coca-Cola 390ml','minuman',6500,5500,24,'🥤'),
    P('Sabun Cuci Piring 755ml','rt',18000,16000,14,'🧽'),P('Deterjen Bubuk 770g','rt',23000,20500,12,'🫧'),P('Tisu 250 lembar','rt',14000,12000,10,'🧻'),P('Obat Nyamuk Semprot','rt',38000,34000,6,'🦟'),
    P('Sabun Mandi 110g','pribadi',5000,4000,30,'🧼'),P('Shampoo Sachet','pribadi',1000,750,100,'🧴'),P('Pasta Gigi 190g','pribadi',15000,13000,15,'🪥'),
    P('Paracetamol (strip)','obat',5000,3800,20,'💊'),P('Tolak Angin','obat',4500,3800,30,'🌿'),P('Minyak Kayu Putih 60ml','obat',24000,21000,2,'🫙'),
    P('LPG 3kg','gas',22000,19500,10,'🔥'),P('Isi Ulang Galon','gas',6000,3500,50,'🫙'),
    P('Korek Api Gas','lain',2000,1300,40,'🔥'),P('Baterai AA (2 pcs)','lain',10000,8000,12,'🔋')];
  const members=[
    {id:uid(),name:'Budi Santoso',phone:'081234567890',points:120,joined:Date.now()-20*864e5},
    {id:uid(),name:'Siti Aminah',phone:'085712345678',points:65,joined:Date.now()-15*864e5},
    {id:uid(),name:'Pak Joko',phone:'081398765432',points:240,joined:Date.now()-30*864e5},
    {id:uid(),name:'Bu Rina',phone:'087855512345',points:18,joined:Date.now()-5*864e5}];
  const s={v:1,cats,products,members,trx:[],seq:0,
    set:{store:'DhewaMart',addr:'Jl. Contoh No. 1, Surabaya',phone:'0812-0000-0000',kasirs:['Kasir 1'],kasir:'Kasir 1',
      pointPer:10000,pointVal:100,minRedeem:50,qris:'',qrisImg:'',footer:'Terima kasih sudah berbelanja 🙏',
      admin:{u:'admin',p:'admin123'}}};
  // transaksi demo 14 hari agar dashboard terisi
  for(let d=13;d>=0;d--){
    const n=6+Math.floor(Math.random()*10);
    for(let k=0;k<n;k++){
      const dt=new Date();dt.setDate(dt.getDate()-d);dt.setHours(7+Math.floor(Math.random()*14),Math.floor(Math.random()*60));
      if(d===0&&dt>new Date())dt.setTime(Date.now()-Math.random()*36e5*3);
      const items=[];const m=1+Math.floor(Math.random()*3);
      for(let j=0;j<m;j++){const p=products[Math.floor(Math.random()*products.length)];if(items.find(x=>x.id===p.id))continue;
        items.push({id:p.id,name:p.name,cat:p.cat,price:p.price,cost:p.cost,qty:1+Math.floor(Math.random()*2)})}
      const sub=items.reduce((a,b)=>a+b.price*b.qty,0);
      const mem=Math.random()<.4?members[Math.floor(Math.random()*members.length)]:null;
      s.seq++;

  }
  s.trx.sort((a,b)=>b.date-a.date);
  return s;
}
let S;
try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}
let API=false,TOKEN='';try{TOKEN=sessionStorage.getItem('kasirku_tok')||''}catch(e){}
function save(){if(API){try{localStorage.setItem('kasirku_kasir',S.set.kasir||'')}catch(e){}return}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Penyimpanan browser penuh / tidak tersedia')}}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'content-type':'application/json',...(TOKEN?{authorization:'Bearer '+TOKEN}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:'Server tidak merespon dengan benar'}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function reload(){const d=await api('/api/bootstrap');let k='';try{k=localStorage.getItem('kasirku_kasir')||''}catch(e){}
  S={v:1,cats:d.cats,products:d.products,members:d.members,trx:d.trx,seq:0,set:{...d.set,kasir:d.set.kasirs.includes(k)?k:(d.set.kasirs[0]||''),admin:{u:d.set.adminU||'',p:''}}};
  if(typeof U!=='undefined')U.admin=!!d.admin;
  if(!d.admin&&TOKEN){TOKEN='';try{sessionStorage.removeItem('kasirku_tok')}catch(e){}}return d}
// kirim perubahan ke Cloudflare D1 (mode online); jika gagal, data dimuat ulang dari server
async function op(name,data){if(!API)return true;try{await api('/api/op',{op:name,data});return true}catch(e){toast('✗ '+e.message);try{await reload()}catch(_){}render();return false}}
if(S.set.store==='Toko Berkah Jaya')S.set.store='DhewaMart';
save();

/* ================== UI STATE ================== */
let savedMode=null;try{savedMode=localStorage.getItem('kasirku_mode')}catch(e){}
let adm=false;try{adm=sessionStorage.getItem('kasirku_adm')==='1'}catch(e){}
const U={mode:savedMode||(innerWidth>=1024?'desktop':'mobile'),view:'kasir',cat:'all',q:'',cart:[],member:null,usePts:false,admin:adm,sheet:null,
  pq:'',pcat:'all',mq:'',hr:'today',hq:'',dr:7};
U.view=U.mode==='desktop'?'dashboard':'kasir';
const VIEWS={dashboard:['Dashboard','dash',1],kasir:['Kasir','cart',0],produk:['Produk & Stok','box',1],member:['Member & Poin','users',0],riwayat:['Riwayat','receipt',0],setelan:['Pengaturan','set',0]};
const CATCOL=['#0F766E','#B45309','#7C3AED','#0369A1','#BE185D','#15803D','#C2410C','#4338CA','#475569','#0E7490','#A16207'];
const catOf=id=>S.cats.find(c=>c.id===id)||{id:'lain',name:'Lain-lain',ico:'📦'};
const catColor=id=>{const i=S.cats.findIndex(c=>c.id===id);return CATCOL[(i<0?8:i)%CATCOL.length]};
const prod=id=>S.products.find(p=>p.id===id);
const memb=id=>S.members.find(m=>m.id===id);
const thumb=(p,cls='em')=>`<div class="${cls}" style="background:${catColor(p.cat)}18">${p.img?`<img src="${p.img}">`:(p.ico||catOf(p.cat).ico)}</div>`;

/* ================== RENDER ================== */
function render(){
  document.body.className=U.mode;
  const sc=$('#main');const top=sc?sc.scrollTop:0;const kp=$('.kprod');const kt=kp?kp.scrollTop:0;
  $('#app').innerHTML=U.mode==='mobile'?mShell():dShell();
  const m=$('#main');if(m&&m.dataset.v===U._lastv)m.scrollTop=top;
  const k=$('.kprod');if(k&&U._lastv===U.view)k.scrollTop=kt;
  U._lastv=U.view;
  if(U.view==='dashboard'&&canSee())setTimeout(drawCharts,20);
}
const canSee=()=>!VIEWS[U.view][2]||U.admin;
function viewHTML(){
  if(!canSee())return loginCard();
  return ({dashboard:vDash,kasir:vKasir,produk:vProduk,member:vMember,riwayat:vRiwayat,setelan:vSetelan})[U.view]();
}
function mShell(){
  const c=calc();const n=U.cart.reduce((a,b)=>a+b.qty,0);
  return `<div class="phone">
  <header class="mh">
    <div class="mlogo">${ic('cart',22)}</div><div class="f1"><div class="store ell">${esc(S.set.store)}</div>
    <button class="kchip" onclick="pickKasir()">${ic('user',13)} ${esc(S.set.kasir||'Atur kasir')} ▾</button></div>
    <div class="row">${U.admin?`<span class="badge" style="background:rgba(255,255,255,.18);color:#fff">${ic('lock',11)} Admin</span>`:''}
    <button class="ibtn" title="Tampilan Laptop" onclick="setMode('desktop')">${ic('monitor',18)}</button></div>
  </header>
  <main id="main" class="scroll" data-v="${U.view}">${viewHTML()}</main>
  ${U.view==='kasir'&&n?`<div class="cartbar" onclick="openCart()"><div class="row"><div class="cnt">${n}</div><div><div class="xs" style="opacity:.7">Total belanja</div><b style="font-size:16px">${rp(c.total)}</b></div></div><div class="go">Bayar →</div></div>`:''}
  <nav class="bnav">${['kasir','produk','member','riwayat','setelan'].map(v=>`<button class="${U.view===v?'on':''}" onclick="go('${v}')">${ic(VIEWS[v][1],21)}${VIEWS[v][0].split(' ')[0]}</button>`).join('')}</nav>
  </div>`;
}
function dShell(){
  const d=new Date();
  return `<div class="desk">
  <aside class="side">
    <div class="brand"><div class="logo">${ic('cart',22)}</div><div class="f1"><b class="ell">${esc(S.set.store)}</b><small class="ell" style="display:block">Aplikasi Kasir</small></div></div>
    <nav class="snav">${Object.keys(VIEWS).map(v=>`<button class="${U.view===v?'on':''}" onclick="go('${v}')">${ic(VIEWS[v][1],19)}${VIEWS[v][0]}${VIEWS[v][2]&&!U.admin?`<span class="lk">${ic('lock',13)}</span>`:''}</button>`).join('')}</nav>
    <div class="side-foot">
      <div class="xs" style="margin:0 4px 6px;font-weight:700;letter-spacing:.5px">TAMPILAN</div>
      <div class="modesw"><button onclick="setMode('mobile')">${ic('phone',14)} Android</button><button class="on">${ic('monitor',14)} Laptop</button></div>
      ${U.admin?`<button class="btn ghost sm block" style="background:rgba(255,255,255,.08);color:#CFE3DF" onclick="logout()">${ic('logout',15)} Keluar Admin</button>`:`<button class="btn sm block" style="background:#14B8A6;color:#062A26" onclick="go('setelan')">${ic('lock',15)} Login Admin</button>`}
      <div style="margin-top:14px;text-align:center;line-height:1.5">Develop Program By<br><b style="color:#CFE3DF">Nurman Catra</b></div>
    </div>
  </aside>
  <section class="dmain">
    <header class="dh"><h1>${VIEWS[U.view][0]}</h1>
      <div class="row" style="gap:12px"><span class="mut sm">${HARI[d.getDay()]}, ${d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</span>
      <button class="kchip" onclick="pickKasir()">${ic('user',13)} ${esc(S.set.kasir||'Atur kasir')} ▾</button>
      ${U.admin?'<span class="badge g">● Admin</span>':''}</div>
    </header>
    <div id="main" class="dscroll ${U.view==='kasir'&&canSee()?'fix':''}" data-v="${U.view}">${viewHTML()}</div>
  </section></div>`;
}
function go(v){U.view=v;closeModal();render()}
function setMode(m){U.mode=m;try{localStorage.setItem('kasirku_mode',m)}catch(e){}
  if(m==='desktop'&&U.view==='kasir'&&!U.cart.length)U.view='dashboard';
  if(m==='mobile'&&U.view==='dashboard')U.view='kasir';
  closeModal();render();toast(m==='mobile'?'📱 Tampilan Android':'💻 Tampilan Laptop')}

/* ================== MODAL ================== */
let _cb=null;
function openModal(html,cls=''){ $('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="mbox ${cls}">${cls.includes('cartsheet')?'':'<div class="grab"></div>'}${html}</div></div>`}
function closeModal(){ $('#modal').innerHTML='';U.sheet=null}
const mh=t=>`<div class="mhead"><h3>${t}</h3><button class="ibtn" onclick="closeModal()">${ic('x',18)}</button></div>`;
function ask(msg,cb,danger){_cb=cb;openModal(`${mh('Konfirmasi')}<p class="mut" style="margin:6px 0 18px">${msg}</p><div class="row2"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn ${danger?'danger':'pri'}" onclick="const f=_cb;closeModal();f&&f()">Ya, lanjut</button></div>`)}

/* ================== LOGIN ================== */
function loginCard(){
  return `<div class="login card"><div class="lic">${ic('lock')}</div><h3 style="font-size:18px;font-weight:800">Login Admin</h3>
  <p class="mut sm" style="margin:4px 0 6px">Halaman ini khusus admin (tambah produk, harga, stok, laporan & pengaturan).</p>

function checkCart(){if(!U.cart.length)return false;for(const c of U.cart){const p=prod(c.id);if(!p||p.stock<c.qty){toast('⚠️ Stok '+(p?p.name:'')+' tidak cukup');return false}}
  if(!S.set.kasir){toast('⚠️ Atur nama kasir dulu di Pengaturan');return false}return true}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,'0')}
function dynQris(stat,amount){
  if(!stat)return null;let s=stat.trim().replace(/\s/g,'');
  if(!s.startsWith('000201')||s.indexOf('5802ID')<0)return null;
  const i=s.lastIndexOf('6304');if(i>-1)s=s.slice(0,i);
  s=s.replace('010211','010212');
  const amt=String(Math.round(amount));const tag='54'+pad(amt.length)+amt;
  const p=s.indexOf('5802ID');s=s.slice(0,p)+tag+s.slice(p)+'6304';
  return s+crc16(s);
}
function qrisMerchant(){const s=S.set.qris;if(!s)return '';const i=s.indexOf('59');
  // parse TLV sederhana untuk nama merchant (tag 59)
  let k=0;while(k<s.length-4){const t=s.substr(k,2),l=+s.substr(k+2,2);if(isNaN(l))break;if(t==='59')return s.substr(k+4,l);k+=4+l}return ''}
function payQris(){
  if(!checkCart())return;const c=calc();
  const payload=dynQris(S.set.qris,c.total);const useImg=!payload&&S.set.qrisImg;
  openModal(`${mh('Pembayaran QRIS')}
  <div class="qris"><div class="qris-h"><span class="qlogo">QR<i>IS</i></span><span class="xs mut b">QR Code Standar Pembayaran Nasional</span></div>
  <div class="qris-b"><div class="b">${esc(qrisMerchant()||S.set.store)}</div><div class="xs mut" style="margin-bottom:12px">${payload?'QRIS dinamis · nominal otomatis':useImg?'QRIS statis · pelanggan input nominal':'Mode demo'}</div>
  ${useImg?`<img src="${S.set.qrisImg}" style="width:230px;border-radius:12px;border:1px solid var(--line)">`:'<div id="qrbox"></div>'}
  <div class="xs mut" style="margin-top:10px">Total bayar</div><div class="qamt">${rp(c.total)}</div>
  <div class="ewal">${['GoPay','OVO','DANA','ShopeePay','LinkAja','m-Banking'].map(e=>`<span class="badge">${e}</span>`).join('')}</div>
  ${!payload&&!useImg?`<div class="demo-w">${ic('alert',16)}<span>QR ini masih <b>contoh</b>. Masukkan string / gambar QRIS toko di <b>Pengaturan → QRIS</b> agar pelanggan bisa scan sungguhan.</span></div>`:''}
  ${useImg?`<div class="demo-w">${ic('alert',16)}<span>Minta pelanggan mengetik nominal <b>${rp(c.total)}</b> saat scan.</span></div>`:''}
  <div class="waiting"><span class="dot"></span>Menunggu pembayaran… cek notifikasi di HP merchant</div></div></div>
  <button class="btn pri block lg" onclick="finish('QRIS',${c.total})">${ic('check')} Pembayaran Diterima</button>
  <button class="btn ghost block" style="margin-top:8px" onclick="${U.mode==='mobile'?'openCart()':'closeModal()'}">Kembali</button>`);
  if(!useImg)setTimeout(()=>{const el=$('#qrbox');if(!el)return;
    if(window.QRCode)new QRCode(el,{text:payload||('DEMO-QRIS|'+S.set.store+'|'+c.total),width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
    else el.innerHTML='<div class="mut sm" style="width:220px;height:220px;display:grid;place-items:center">Library QR gagal dimuat</div>'},30);
}
function payCash(){
  if(!checkCart())return;const t=calc().total;
  const q=[...new Set([t,Math.ceil(t/5000)*5000,Math.ceil(t/10000)*10000,Math.ceil(t/50000)*50000,Math.ceil(t/100000)*100000])].filter(v=>v>=t).slice(0,4);

function cashCalc(){const el=$('#cash');const v=num(el.value);el.value=v?v.toLocaleString('id-ID'):'';const t=calc().total;

async function finish(method,paid){
  const c=calc();if(!checkCart())return;

    U.cart=[];U.member=null;U.usePts=false;closeModal();render();showReceipt(r.trx.id,true)}catch(e){toast('✗ '+e.message)}finally{U._busy=0}return}

/* ================== RIWAYAT ================== */
function rangeStart(r){const d=new Date();d.setHours(0,0,0,0);if(r==='today'||r===1)return d.getTime();if(r==='all')return 0;d.setDate(d.getDate()-(r-1));return d.getTime()}
function vRiwayat(){
  const st=rangeStart(U.hr==='today'?1:U.hr==='7'?7:U.hr==='30'?30:'all');const q=U.hq.toLowerCase();
  const list=S.trx.filter(t=>t.date>=st&&(!q||t.no.toLowerCase().includes(q)||(t.memberName||'').toLowerCase().includes(q)||t.items.some(i=>i.name.toLowerCase().includes(q))));
  const om=list.reduce((a,t)=>a+t.total,0),qr=list.filter(t=>t.method==='QRIS').reduce((a,t)=>a+t.total,0);

function loadImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const s=240;const k=Math.min(im.width,im.height);c.width=c.height=s;
  c.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,s,s);_img=c.toDataURL('image/jpeg',.72);$('#imgprev').innerHTML=`<img src="${_img}" style="width:100%;height:100%;object-fit:cover"><input type="file" accept="image/*" hidden onchange="loadImg(this)">`};im.src=e.target.result};r.readAsDataURL(f)}

  <button class="btn ghost" style="color:var(--red)" onclick="ask('Reset SEMUA data (produk, member, transaksi) ke awal?',()=>{S=seed();save();U.cart=[];render();toast('Data direset')},1)">Reset semua</button></div></div>`;
  return `<div class="${m==='desktop'?'desk-cols':''}"><div>${tampilan}${kasir}${toko}${akun}</div><div>${poin}${qris}${data}</div></div>
  <div style="position:sticky;bottom:${m==='mobile'?'-100px':'-30px'};padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)"><div class="row2" style="max-width:520px;margin:0 auto"><button class="btn ghost lg" onclick="logout()">${ic('logout',18)} Keluar Admin</button><button class="btn pri lg" onclick="saveSettings()">${ic('check')} Simpan</button></div></div>
  <div class="credit">Develop Program By <b>Nurman Catra</b></div>`;
}
function addKasir(){const n=$('#nk').value.trim();if(!n)return;if(S.set.kasirs.includes(n)){toast('Nama sudah ada');return}S.set.kasirs.push(n);if(!S.set.kasir)S.set.kasir=n;op('kasir.set',{kasirs:S.set.kasirs});save();render();toast('✓ Kasir ditambah')}
function delKasir(i){const k=S.set.kasirs[i];S.set.kasirs.splice(i,1);if(S.set.kasir===k)S.set.kasir=S.set.kasirs[0]||'';op('kasir.set',{kasirs:S.set.kasirs});save();render()}
function loadQrisImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const k=Math.min(1,600/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.set.qrisImg=c.toDataURL('image/jpeg',.85);op('qrisImg',{img:S.set.qrisImg});save();render();toast('✓ Gambar QRIS tersimpan')};im.src=e.target.result};r.readAsDataURL(f)}
async function saveSettings(){const s=S.set;const g=id=>$('#'+id)?$('#'+id).value:null;
  s.store=g('s_store').trim()||'Toko Saya';s.addr=g('s_addr').trim();s.phone=g('s_phone').trim();s.footer=g('s_footer').trim();
  s.pointPer=num(g('s_pp'))||10000;s.pointVal=num(g('s_pv'))||100;s.minRedeem=num(g('s_mr'));
  const q=g('s_qris').trim();if(q&&!dynQris(q,1000)){toast('✗ String QRIS tidak valid — cek lagi');return}s.qris=q;
  const u=g('s_u').trim();if(u)s.admin.u=u;const p=g('s_p');if(p){if(p.length<4){toast('Password minimal 4 karakter');return}if(!API)s.admin.p=p}
  if(!(await op('settings.save',{store:s.store,addr:s.addr,phone:s.phone,footer:s.footer,pointPer:s.pointPer,pointVal:s.pointVal,minRedeem:s.minRedeem,qris:s.qris,adminU:u,adminP:p})))return;
  save();render();toast('✓ Pengaturan disimpan')}

/* ================== DASHBOARD ================== */
let charts=[];
function stats(days){
  const st=rangeStart(days);const L=S.trx.filter(t=>t.date>=st);
  const r={omzet:0,profit:0,count:L.length,items:0,qris:0,cash:0,pts:0,byCat:{},byProd:{},list:L};
  L.forEach(t=>{r.omzet+=t.total;r.pts+=t.earn||0;t.method==='QRIS'?r.qris+=t.total:r.cash+=t.total;r.profit-=t.disc||0;
    t.items.forEach(i=>{r.items+=i.qty;r.profit+=(i.price-(i.cost||0))*i.qty;r.byCat[i.cat]=(r.byCat[i.cat]||0)+i.price*i.qty;
      const b=r.byProd[i.id]||(r.byProd[i.id]={name:i.name,cat:i.cat,qty:0,val:0});b.qty+=i.qty;b.val+=i.price*i.qty})});
  return r;
}
function vDash(){
  const d=U.dr;const s=stats(d);const prev=(()=>{const a=rangeStart(d*2),b=rangeStart(d);return S.trx.filter(t=>t.date>=a&&t.date<b).reduce((x,t)=>x+t.total,0)})();
  const gr=prev?Math.round((s.omzet-prev)/prev*100):0;
  const top=Object.values(s.byProd).sort((a,b)=>b.qty-a.qty).slice(0,6);const mx=top[0]?top[0].qty:1;
  const low=S.products.filter(p=>p.stock<=(p.min||0)).sort((a,b)=>a.stock-b.stock).slice(0,8);
  const topM=S.members.slice().sort((a,b)=>b.points-a.points).slice(0,5);
  const K=(lbl,val,icn,col,extra='')=>`<div class="kpi"><div class="ki" style="background:${col}18;color:${col}">${ic(icn)}</div><small>${lbl}</small><b>${val}</b>${extra}</div>`;
  return `<div class="tbar" style="justify-content:space-between"><div class="tabs">${[[1,'Hari ini'],[7,'7 Hari'],[30,'30 Hari']].map(([k,l])=>`<button class="${d===k?'on':''}" onclick="U.dr=${k};render()">${l}</button>`).join('')}</div>
  <button class="btn pri sm" onclick="go('kasir')">${ic('cart',16)} Buka Kasir</button></div>
  <div class="kpis"><div class="kpi hero"><div class="ki">${ic('trend')}</div><small>Omzet ${d===1?'hari ini':d+' hari'}</small><b>${rp(s.omzet)}</b><div class="xs" style="margin-top:4px;color:#B5E2DA">${prev?`${gr>=0?'▲':'▼'} ${Math.abs(gr)}% vs periode sebelumnya`:'—'}</div></div>
  ${K('Laba kotor',rp(s.profit),'coins','#15803D',`<div class="xs mut" style="margin-top:4px">Margin ${s.omzet?Math.round(s.profit/s.omzet*100):0}%</div>`)}
  ${K('Transaksi',s.count.toLocaleString('id-ID'),'receipt','#7C3AED',`<div class="xs mut" style="margin-top:4px">Rata² ${rp(s.count?s.omzet/s.count:0)}</div>`)}
  ${K('Item terjual',s.items.toLocaleString('id-ID'),'box','#B45309')}
  ${K('Pembayaran QRIS',rp(s.qris),'qr','#2563EB',`<div class="xs mut" style="margin-top:4px">${s.omzet?Math.round(s.qris/s.omzet*100):0}% dari omzet</div>`)}
  ${K('Poin diberikan',s.pts.toLocaleString('id-ID'),'star','#D97706',`<div class="xs mut" style="margin-top:4px">${S.members.length} member</div>`)}</div>
  <div class="dgrid"><div class="panel"><h4>Tren Penjualan <span class="xs mut">${d===1?'per jam':'per hari'}</span></h4><div class="chartbox"><canvas id="c1"></canvas></div></div>
  <div class="panel"><h4>Per Kategori</h4><div class="chartbox"><canvas id="c2"></canvas></div></div></div>
  <div class="dgrid3"><div class="panel"><h4>Produk Terlaris</h4>${top.length?top.map((p,i)=>`<div style="margin-bottom:10px"><div class="row sp sm"><span class="row f1"><span class="rank">${i+1}</span><span class="ell b">${esc(p.name)}</span></span><span class="mut">${p.qty} pcs</span></div><div class="bar"><i style="width:${p.qty/mx*100}%;background:${catColor(p.cat)}"></i></div></div>`).join(''):'<div class="empty">Belum ada data</div>'}</div>
  <div class="panel"><h4>Stok Menipis <span class="badge rd">${S.products.filter(p=>p.stock<=(p.min||0)).length}</span></h4>${low.length?`<table class="tbl">${low.map(p=>`<tr><td><span class="ell b" style="display:block;max-width:170px">${p.ico||''} ${esc(p.name)}</span></td><td class="r"><span class="badge ${p.stock<=0?'rd':'y'}">${p.stock}</span></td><td class="r"><button class="btn ghost sm" onclick="restock('${p.id}')">+ Stok</button></td></tr>`).join('')}</table>`:'<div class="empty"><div class="e">✅</div>Semua stok aman</div>'}</div>
  <div class="panel"><h4>Member Teratas</h4>${topM.map(m=>`<div class="row" style="padding:7px 0"><div class="av" style="width:32px;height:32px;font-size:13px">${esc(m.name[0])}</div><div class="f1 b sm ell">${esc(m.name)}</div><span class="badge y">${ic('star',11)} ${m.points}</span></div>`).join('')||'<div class="empty">Belum ada member</div>'}
  <div class="sec-t">Transaksi terakhir</div>${S.trx.slice(0,4).map(t=>`<div class="row sp sm" style="padding:6px 0;cursor:pointer" onclick="showReceipt('${t.id}')"><span class="mut">${fdt(t.date).slice(11)} · ${t.method}</span><b>${rp(t.total)}</b></div>`).join('')}</div></div>`;
}
function drawCharts(){
  if(!window.Chart)return;charts.forEach(c=>c.destroy());charts=[];
  const d=U.dr;const s=stats(d);let labels=[],vals=[];
  if(d===1){for(let h=6;h<=22;h++){labels.push(pad(h)+':00');vals.push(s.list.filter(t=>new Date(t.date).getHours()===h).reduce((a,t)=>a+t.total,0))}}
  else{for(let i=d-1;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);const k=dkey(x);labels.push(d<=7?HARI[x.getDay()]+' '+x.getDate():x.getDate()+'/'+(x.getMonth()+1));vals.push(s.list.filter(t=>dkey(t.date)===k).reduce((a,t)=>a+t.total,0))}}
  const c1=$('#c1');if(c1){const g=c1.getContext('2d').createLinearGradient(0,0,0,260);g.addColorStop(0,'rgba(15,118,110,.28)');g.addColorStop(1,'rgba(15,118,110,0)');
    charts.push(new Chart(c1,{type:d===7?'bar':'line',data:{labels,datasets:[{data:vals,borderColor:'#0F766E',backgroundColor:d===7?'#14B8A6':g,fill:true,tension:.35,borderWidth:2.5,pointRadius:d===30?0:3,pointBackgroundColor:'#0F766E',borderRadius:8,maxBarThickness:38}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>rp(c.raw)}}},scales:{x:{grid:{display:false},ticks:{font:{family:'Plus Jakarta Sans',size:11},maxRotation:0,autoSkip:true}},y:{grid:{color:'#EEF2F1'},border:{display:false},ticks:{font:{family:'Plus Jakarta Sans',size:11},callback:v=>v>=1e6?(v/1e6).toFixed(1)+'jt':v>=1e3?(v/1e3)+'rb':v}}}}}))}
  const c2=$('#c2');if(c2){const ent=Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]);
    charts.push(new Chart(c2,{type:'doughnut',data:{labels:ent.map(e=>catOf(e[0]).name),datasets:[{data:ent.map(e=>e[1]),backgroundColor:ent.map(e=>catColor(e[0])),borderWidth:2,borderColor:'#fff'}]},
    options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,font:{family:'Plus Jakarta Sans',size:11}}},tooltip:{callbacks:{label:c=>c.label+': '+rp(c.raw)}}}}}))}
}

window.addEventListener('resize',()=>{if(U.view==='dashboard')drawCharts()});
(async()=>{
  if(location.protocol.startsWith('http')){try{await reload();API=true}catch(e){API=false}}
  if(!API){S=S||seed()}
  render();
  setInterval(async()=>{const a=document.activeElement;if(!API||$('#modal').innerHTML||U.cart.length||(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)))return;
    try{await reload();render()}catch(e){}},30000);
})();
</script>
